<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#fff4d9"><title>解压小剧场</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#fff4d9;color:#342c29;font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;display:grid;place-items:center;padding:18px}.app{width:min(100%,520px);background:#fffdf7;border:3px solid #342c29;border-radius:30px;box-shadow:0 9px 0 #342c29;overflow:hidden}.top{padding:22px 22px 10px;text-align:center}.tag{font-size:12px;font-weight:900;letter-spacing:.13em;color:#ef765b}.top h1{font-size:30px;margin:5px 0}.top p{margin:0;color:#82776d;font-size:14px}.stage{height:355px;margin:12px 16px 0;border:2px solid #342c29;border-radius:24px;background:linear-gradient(#bce8ef 0 67%,#97d9a0 67%);position:relative;overflow:hidden;touch-action:none}.sun{position:absolute;width:60px;height:60px;border-radius:50%;background:#ffd36b;right:35px;top:25px}.cloud{position:absolute;left:30px;top:44px;font-size:40px;opacity:.8}.ground{position:absolute;bottom:38px;left:0;right:0;height:3px;background:#342c29}.person{position:absolute;width:124px;height:235px;left:50%;bottom:39px;transform:translateX(-50%);transition:transform .15s;filter:drop-shadow(0 3px 0 #342c29)}.person.shake{animation:shake .38s ease}.person.punch{animation:punch .3s ease}.face{position:absolute;top:0;left:22px;width:80px;height:83px;border:3px solid #342c29;border-radius:45% 45% 42% 42%;background:#ffc996;z-index:2}.hair{position:absolute;left:-2px;top:-7px;font-size:57px;line-height:55px;z-index:3}.eye{position:absolute;top:38px;width:6px;height:9px;border-radius:50%;background:#342c29}.eye.a{left:24px}.eye.b{right:24px}.mouth{position:absolute;left:34px;top:55px;width:13px;height:8px;border-bottom:3px solid #342c29;border-radius:50%}.body{position:absolute;top:78px;left:26px;width:74px;height:102px;border:3px solid #342c29;border-radius:24px 24px 12px 12px;background:#ef765b}.arm{position:absolute;top:93px;width:21px;height:78px;border:3px solid #342c29;border-radius:15px;background:#ffc996;transform-origin:top}.arm.l{left:10px;transform:rotate(22deg)}.arm.r{right:8px;transform:rotate(-23deg)}.leg{position:absolute;top:166px;width:23px;height:67px;border:3px solid #342c29;border-radius:12px;background:#617bd6}.leg.l{left:34px;transform:rotate(5deg)}.leg.r{right:34px;transform:rotate(-5deg)}.splats{position:absolute;inset:0;pointer-events:none}.splat{position:absolute;font-size:36px;animation:pop .55s ease-out forwards;filter:drop-shadow(1px 2px #fff)}.hint{position:absolute;bottom:9px;left:0;right:0;text-align:center;font-size:12px;color:#477263;font-weight:700}.stats{display:flex;justify-content:center;gap:12px;padding:14px 12px 6px}.pill{border:2px solid #342c29;border-radius:30px;padding:7px 13px;font-size:13px;background:#fff}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px 16px 16px}.btn{border:2px solid #342c29;border-radius:17px;padding:12px 4px;background:#fff;font:700 14px inherit;color:#342c29;box-shadow:0 4px 0 #342c29;cursor:pointer;transition:transform .08s,box-shadow .08s;touch-action:manipulation}.btn:active{transform:translateY(4px);box-shadow:0 0 0 #342c29}.btn span{display:block;font-size:24px;margin-bottom:2px}.btn.red{background:#ffddd0}.btn.yellow{background:#fff0ae}.btn.blue{background:#dce7ff}.footer{text-align:center;padding:0 12px 18px;color:#9d9185;font-size:11px}@keyframes shake{0%,100%{transform:translateX(-50%) rotate(0)}25%{transform:translateX(calc(-50% - 16px)) rotate(-10deg)}55%{transform:translateX(calc(-50% + 14px)) rotate(10deg)}80%{transform:translateX(calc(-50% - 7px)) rotate(-4deg)}}@keyframes punch{50%{transform:translateX(-50%) scale(1.08)}}@keyframes pop{0%{transform:scale(.2) rotate(-25deg);opacity:0}25%{transform:scale(1.3) rotate(15deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:0}}
/* Character polish and a visible arcing throw */
.hair{left:5px;top:-7px;width:64px;height:27px;background:#493b38;border:3px solid #342c29;border-bottom:0;border-radius:38px 38px 10px 10px;font-size:0}
.person{width:150px}.face{left:36px;background:linear-gradient(135deg,#ffd4a8,#f1a776);box-shadow:inset -5px -5px #e99c72}.body{left:36px;background:linear-gradient(120deg,#ff9075,#df5d54);box-shadow:inset -8px 0 rgba(150,48,48,.14)}.arm.l{left:20px}.arm.r{right:17px}.leg.l{left:44px}.leg.r{right:44px}.cheek{position:absolute;top:51px;width:12px;height:7px;border-radius:50%;background:#f28d79}.cheek.a{left:10px}.cheek.b{right:10px}.collar{position:absolute;z-index:2;left:56px;top:79px;width:34px;height:20px;background:#fff4d9;clip-path:polygon(0 0,50% 55%,100% 0,75% 100%,50% 60%,25% 100%)}.hand{position:absolute;bottom:-7px;left:-5px;width:24px;height:23px;background:#ffc996;border:3px solid #342c29;border-radius:50%}.shoe{position:absolute;bottom:-3px;width:35px;height:17px;border:3px solid #342c29;border-radius:12px 12px 7px 7px;background:#493b38}.leg.l .shoe{left:-8px}.leg.r .shoe{right:-8px}@keyframes fly{0%{transform:translate(0,0) scale(.85) rotate(0)}45%{transform:translate(var(--dx),var(--arc)) scale(1.08) rotate(230deg)}100%{transform:translate(var(--dx),var(--dy)) scale(.8) rotate(500deg)}}
 .punch-fx{position:absolute;z-index:5;font-size:54px;pointer-events:none;filter:drop-shadow(2px 3px 0 #342c29);animation:punchFx .42s cubic-bezier(.2,.75,.25,1) forwards}@keyframes punchFx{0%{transform:translate(-34px,24px) scale(.15) rotate(-45deg);opacity:0}35%{transform:translate(0,0) scale(1.35) rotate(10deg);opacity:1}60%{transform:translate(3px,-4px) scale(.85) rotate(-7deg);opacity:1}100%{transform:translate(7px,-12px) scale(1.25) rotate(12deg);opacity:0}}.punch-flash{position:absolute;z-index:4;font-size:42px;pointer-events:none;animation:flashHit .38s ease-out forwards;filter:drop-shadow(0 0 5px #fff)}@keyframes flashHit{0%{transform:scale(.1) rotate(-25deg);opacity:0}35%{transform:scale(1.25) rotate(12deg);opacity:1}100%{transform:scale(.6) rotate(35deg);opacity:0}}.tomato-burst{position:absolute;z-index:4;width:10px;height:10px;border-radius:50%;pointer-events:none;background:#ed463b;box-shadow:0 0 0 4px rgba(237,70,59,.2);animation:tomatoBurst .55s ease-out forwards}.tomato-burst i{position:absolute;width:11px;height:11px;border-radius:70% 35% 65% 40%;background:#ed463b;border:1px solid #ba302b;left:0;top:0;transform:rotate(var(--rot));animation:tomatoDrop .5s ease-out forwards}@keyframes tomatoBurst{0%{transform:scale(.2);opacity:1}35%{transform:scale(2.8);opacity:1}100%{transform:scale(3.4);opacity:0}}@keyframes tomatoDrop{0%{transform:translate(0,0) rotate(var(--rot)) scale(.3);opacity:1}100%{transform:translate(var(--tx),var(--ty)) rotate(calc(var(--rot) + 150deg)) scale(1);opacity:0}}.egg-burst{position:absolute;z-index:4;width:12px;height:12px;border-radius:50%;pointer-events:none;background:#ffcf55;box-shadow:0 0 0 4px rgba(255,207,85,.25);animation:eggPop .55s ease-out forwards}.egg-burst i{position:absolute;left:1px;top:1px;width:10px;height:14px;background:#fffdf4;border:1px solid #d6c9ab;border-radius:80% 25% 75% 35%;animation:eggShell .52s ease-out forwards;transform:rotate(var(--rot))}.egg-burst:after{content:"";position:absolute;width:14px;height:14px;left:-1px;top:-1px;border-radius:50%;background:#ffce4f;animation:yolk .5s ease-out forwards}@keyframes eggPop{0%{transform:scale(.2);opacity:1}35%{transform:scale(2.5);opacity:1}100%{transform:scale(3);opacity:0}}@keyframes eggShell{0%{transform:translate(0,0) rotate(var(--rot)) scale(.3);opacity:1}100%{transform:translate(var(--tx),var(--ty)) rotate(calc(var(--rot) + 180deg)) scale(.8);opacity:0}}@keyframes yolk{0%{transform:scale(.2)}35%{transform:scale(1.8)}100%{transform:scale(1.1);opacity:0}}
.hp-panel{margin:5px 24px 0;padding:8px 13px 10px;background:#fff;border:2px solid #342c29;border-radius:15px}.hp-label{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:6px}.hp-label b{font-size:13px;color:#ef765b;letter-spacing:.08em}.hp-track{height:11px;border:1.5px solid #342c29;border-radius:10px;background:#f4e9df;overflow:hidden}.hp-track div{height:100%;width:100%;border-radius:inherit;background:linear-gradient(90deg,#77cf87,#43b778);transition:width .25s,background .25s}
</style></head>
<body><main class="app"><header class="top"><div class="tag">PLAY · RELAX · REPEAT</div><h1>解压小剧场</h1><p>今天的坏心情，交给这个倒霉蛋吧！</p></header>
<section class="stage" id="stage" aria-label="互动区域"><div class="sun"></div><div class="cloud">☁️</div><div class="ground"></div><div class="person" id="person"><div class="face"><div class="hair"></div><i class="eye a"></i><i class="eye b"></i><i class="cheek a"></i><i class="cheek b"></i><i class="mouth"></i></div><div class="arm l"><i class="hand"></i></div><div class="arm r"><i class="hand"></i></div><div class="body"></div><div class="collar"></div><div class="leg l"><i class="shoe"></i></div><div class="leg r"><i class="shoe"></i></div></div><div class="splats" id="splats"></div><div class="hint">点人物出拳 · 点鸡蛋或番茄自动投掷 ✨</div></section>
<div class="stats"><div class="pill">👊 出拳 <b id="punches">0</b></div><div class="pill">🍅 命中 <b id="hits">0</b></div></div><div class="hp-panel"><div class="hp-label"><b>HP</b><span><strong id="hp-value">100</strong> / 100</span></div><div class="hp-track"><div id="hp-fill"></div></div></div>
<div class="buttons"><button class="btn red" data-item="🍅"><span>🍅</span>丢番茄</button><button class="btn yellow" data-item="🥚"><span>🥚</span>丢鸡蛋</button><button class="btn blue" id="reset"><span>🧹</span>清理重来</button></div><div class="footer">点一下就自动投出，享受卡通式解压 ✨</div></main>
<script>
const stage=document.querySelector('#stage'),person=document.querySelector('#person'),splats=document.querySelector('#splats');let punches=0,hits=0,audioCtx;function sound(){try{audioCtx??=new(window.AudioContext||window.webkitAudioContext)();const c=audioCtx,t=c.currentTime,o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.setValueAtTime(210,t);o.frequency.exponentialRampToValueAtTime(75,t+.12);g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.17)}catch(e){}}function eggSound(){try{audioCtx??=new(window.AudioContext||window.webkitAudioContext)();const c=audioCtx,t=c.currentTime,o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter();o.type='square';o.frequency.setValueAtTime(420,t);o.frequency.exponentialRampToValueAtTime(95,t+.09);f.type='lowpass';f.frequency.value=1300;g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.11);o.connect(f);f.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.12)}catch(e){}}function tomatoSound(){try{audioCtx??=new(window.AudioContext||window.webkitAudioContext)();const c=audioCtx,t=c.currentTime,n=Math.floor(c.sampleRate*.16),buf=c.createBuffer(1,n,c.sampleRate),data=buf.getChannelData(0);for(let i=0;i<n;i++)data[i]=(Math.random()*2-1)*(1-i/n);const src=c.createBufferSource(),filter=c.createBiquadFilter(),g=c.createGain();src.buffer=buf;filter.type='lowpass';filter.frequency.setValueAtTime(1100,t);filter.frequency.exponentialRampToValueAtTime(180,t+.15);g.gain.setValueAtTime(.32,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);src.connect(filter);filter.connect(g);g.connect(c.destination);src.start(t);const o=c.createOscillator(),og=c.createGain();o.type='sine';o.frequency.setValueAtTime(170,t);o.frequency.exponentialRampToValueAtTime(55,t+.11);og.gain.setValueAtTime(.14,t);og.gain.exponentialRampToValueAtTime(.001,t+.12);o.connect(og);og.connect(c.destination);o.start(t);o.stop(t+.13)}catch(e){}}function scream(){if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();const voice=new SpeechSynthesisUtterance('啊！');voice.lang='zh-CN';voice.rate=1.15;voice.pitch=1.5;voice.volume=.8;window.speechSynthesis.speak(voice)}
function face(){const m=document.querySelector('.mouth');m.style.borderBottom='0';m.style.borderTop='3px solid #342c29';m.style.height='12px';setTimeout(()=>{m.style.borderTop='0';m.style.borderBottom='3px solid #342c29';m.style.height='8px'},550)}
function hit(x,y,item){person.classList.remove('shake');void person.offsetWidth;person.classList.add('shake');face();if(item==='👊'){sound();const fist=document.createElement('span');fist.className='punch-fx';fist.textContent='👊';fist.style.left=(x-34)+'px';fist.style.top=(y-42)+'px';splats.append(fist);setTimeout(()=>fist.remove(),450)}else if(item==='🍅')tomatoSound();else eggSound();if(item==='🍅'){const burst=document.createElement('span');burst.className='tomato-burst';burst.style.left=(x-5)+'px';burst.style.top=(y-5)+'px';for(let i=0;i<8;i++){const drop=document.createElement('i'),angle=i*Math.PI/4;drop.style.setProperty('--rot',(i*45)+'deg');drop.style.setProperty('--tx',(Math.cos(angle)*34)+'px');drop.style.setProperty('--ty',(Math.sin(angle)*30)+'px');burst.append(drop)}splats.append(burst);setTimeout(()=>burst.remove(),600)}if(item==='🥚'){const burst=document.createElement('span');burst.className='egg-burst';burst.style.left=(x-6)+'px';burst.style.top=(y-6)+'px';for(let i=0;i<6;i++){const shard=document.createElement('i'),angle=i*Math.PI/3;shard.style.setProperty('--rot',(i*60)+'deg');shard.style.setProperty('--tx',(Math.cos(angle)*30)+'px');shard.style.setProperty('--ty',(Math.sin(angle)*27)+'px');burst.append(shard)}splats.append(burst);setTimeout(()=>burst.remove(),600)}hits++;document.querySelector('#hits').textContent=hits;const s=document.createElement('span');s.className='splat';s.textContent=item==='👊'?'💥':item==='🍅'?'🍅':'🥚';s.style.left=(x-18)+'px';s.style.top=(y-18)+'px';splats.append(s);setTimeout(()=>s.remove(),600);if(item==='👊'){punches++;document.querySelector('#punches').textContent=punches}}
person.addEventListener('pointerdown',e=>{e.preventDefault();person.classList.remove('punch');void person.offsetWidth;person.classList.add('punch');const r=stage.getBoundingClientRect();hit(e.clientX-r.left,e.clientY-r.top,'👊')});
document.querySelectorAll('[data-item]').forEach(b=>b.addEventListener('click',()=>{const box=person.getBoundingClientRect(),r=stage.getBoundingClientRect(),sx=stage.clientWidth/2,sy=stage.clientHeight-53,ex=box.left-r.left+box.width/2+(Math.random()-.5)*28,ey=box.top-r.top+box.height*.43;const p=document.createElement('span');p.className='splat';p.textContent=b.dataset.item;p.style.left=(sx-18)+'px';p.style.top=(sy-18)+'px';p.style.animation='none';p.style.opacity='1';p.style.setProperty('--dx',(ex-sx)+'px');p.style.setProperty('--dy',(ey-sy)+'px');p.style.setProperty('--arc',(-Math.min(100,Math.abs(ex-sx)*.23+45))+'px');p.style.animation='fly .58s cubic-bezier(.2,.7,.25,1) forwards';splats.append(p);setTimeout(()=>{p.remove();hit(ex,ey,b.dataset.item)},540)}));
document.querySelector('#reset').addEventListener('click',()=>{punches=0;hits=0;document.querySelector('#punches').textContent='0';document.querySelector('#hits').textContent='0';splats.replaceChildren()});
</script><script>person.addEventListener('pointerdown',e=>{const r=stage.getBoundingClientRect(),flash=document.createElement('span');flash.className='punch-flash';flash.textContent='✴️';flash.style.left=(e.clientX-r.left-20)+'px';flash.style.top=(e.clientY-r.top-24)+'px';splats.append(flash);setTimeout(()=>flash.remove(),400)});</script><script>let hp=100,autoReset=false;const hpValue=document.querySelector('#hp-value'),hpFill=document.querySelector('#hp-fill');function takeHp(item){if(autoReset)return;hp=Math.max(0,hp-(item==='👊'?12:item==='🍅'?18:15));hpValue.textContent=hp;hpFill.style.width=hp+'%';hpFill.style.background=hp<=30?'linear-gradient(90deg,#ff8b72,#e84646)':'linear-gradient(90deg,#77cf87,#43b778)';if(hp===0){autoReset=true;setTimeout(()=>{hp=100;hpValue.textContent='100';hpFill.style.width='100%';hpFill.style.background='linear-gradient(90deg,#77cf87,#43b778)';splats.replaceChildren();autoReset=false},900)}}person.addEventListener('pointerdown',()=>takeHp('👊'));document.querySelectorAll('[data-item]').forEach(button=>button.addEventListener('click',()=>takeHp(button.dataset.item)));</script></body></html>
